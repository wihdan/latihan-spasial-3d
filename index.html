  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- PALET WARNA LAPISAN VIBRANT ---
    const LAYER_PALETTE = [
      { hex: 0x6366f1, css: '#6366f1', label: 'Lapis 1 (Dasar)' },
      { hex: 0x10b981, css: '#10b981', label: 'Lapis 2' },
      { hex: 0xf59e0b, css: '#f59e0b', label: 'Lapis 3' },
      { hex: 0xef4444, css: '#ef4444', label: 'Lapis 4' },
      { hex: 0x8b5cf6, css: '#8b5cf6', label: 'Lapis 5' },
      { hex: 0xec4899, css: '#ec4899', label: 'Lapis 6' },
      { hex: 0x06b6d4, css: '#06b6d4', label: 'Lapis 7' }
    ];

    // --- DAFTAR 4 KATEGORI LATIHAN ---
    const KATEGORI_SOAL = [
      {
        id: 'hitung-kubus',
        kode: 'MODUL 01',
        judul: 'Hitung Kubus Satuan',
        deskripsi: 'Hitung jumlah total kubus penyusun bangun ruang, termasuk bagian yang tersembunyi di bagian dalam atau bawah tumpukan.',
        tag: 'Volume & Lapisan'
      },
      {
        id: 'lengkapi-balok',
        kode: 'MODUL 02',
        judul: 'Melengkapi Bangun Ruang',
        deskripsi: 'Amati kerangka garis batas balok dan hitung berapa banyak kubus kosong yang diperlukan untuk mengisinya hingga penuh.',
        tag: 'Ruang Kosong'
      },
      {
        id: 'proyeksi-2d',
        kode: 'MODUL 03',
        judul: 'Proyeksi Tampak 2D',
        deskripsi: 'Konversi bentuk bangun ruang 3D menjadi gambar proyeksi datar Tampak Atas atau Tampak Depan yang sesuai.',
        tag: 'Ortogonal 2D'
      },
      {
        id: 'jaring-kubus',
        kode: 'MODUL 04',
        judul: 'Jaring-Jaring Kubus',
        deskripsi: 'Putar kubus 3D bersimbol pada panggung dan temukan pola bentangan jaring-jaring 2D yang tepat jika kubus dibuka.',
        tag: 'Lipatan Bidang'
      }
    ];

    // --- KOMPONEN IKON MINIMALIS ---
    const Ikon = ({ nama, ukuran = 18, className = "" }) => {
      const daftarIkon = {
        kiri: <polyline points="15 18 9 12 15 6" />,
        kanan: <polyline points="9 18 15 12 9 6" />,
        ulang: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></>,
        benar: <><polyline points="20 6 9 17 4 12" /></>,
        salah: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
        putar: <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></>,
        jeda: <><line x1="10" y1="5" x2="10" y2="19" /><line x1="14" y1="5" x2="14" y2="19" /></>,
        kotak: <><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></>,
        tutup: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
        matahari: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></>,
        bulan: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
        geser: <><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20" /></>,
        beranda: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={ukuran} height={ukuran} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {daftarIkon[nama]}
        </svg>
      );
    };

    // --- ILUSTRASI SVG UNTUK KARTU BERANDA ---
    const IlustrasiKategori = ({ id }) => {
      if (id === 'hitung-kubus') {
        return (
          <svg viewBox="0 0 80 64" className="w-20 h-16">
            <polygon points="40,12 60,23 40,34 20,23" fill="#6366f1" />
            <polygon points="20,23 40,34 40,54 20,43" fill="#4f46e5" />
            <polygon points="60,23 40,34 40,54 60,43" fill="#818cf8" />
            <polygon points="40,4 52,11 40,18 28,11" fill="#10b981" />
            <polygon points="28,11 40,18 40,30 28,23" fill="#059669" />
            <polygon points="52,11 40,18 40,30 52,23" fill="#34d399" />
          </svg>
        );
      }
      if (id === 'lengkapi-balok') {
        return (
          <svg viewBox="0 0 80 64" className="w-20 h-16">
            <polygon points="40,8 64,21 40,34 16,21" fill="none" stroke="#D94E1F" strokeWidth="1.5" strokeDasharray="3 2" />
            <line x1="16" y1="21" x2="16" y2="45" stroke="#D94E1F" strokeWidth="1.5" strokeDasharray="3 2" />
            <line x1="64" y1="21" x2="64" y2="45" stroke="#D94E1F" strokeWidth="1.5" strokeDasharray="3 2" />
            <line x1="40" y1="34" x2="40" y2="56" stroke="#D94E1F" strokeWidth="1.5" strokeDasharray="3 2" />
            <polygon points="40,32 56,41 40,50 24,41" fill="#f59e0b" />
            <polygon points="24,41 40,50 40,58 24,49" fill="#d97706" />
            <polygon points="56,41 40,50 40,58 56,49" fill="#fbbf24" />
          </svg>
        );
      }
      if (id === 'proyeksi-2d') {
        return (
          <svg viewBox="0 0 80 64" className="w-20 h-16">
            <rect x="14" y="12" width="16" height="16" rx="2" fill="#6366f1" />
            <rect x="32" y="12" width="16" height="16" rx="2" fill="#10b981" />
            <rect x="50" y="12" width="16" height="16" rx="2" fill="none" stroke="currentColor" strokeOpacity="0.25" strokeWidth="1.5" />
            <rect x="14" y="30" width="16" height="16" rx="2" fill="#6366f1" />
            <rect x="32" y="30" width="16" height="16" rx="2" fill="#f59e0b" />
            <rect x="50" y="30" width="16" height="16" rx="2" fill="#6366f1" />
          </svg>
        );
      }
      return (
        <svg viewBox="0 0 80 64" className="w-20 h-16">
          <rect x="33" y="6" width="14" height="14" rx="2" fill="#ef4444" />
          <rect x="17" y="22" width="14" height="14" rx="2" fill="#10b981" />
          <rect x="33" y="22" width="14" height="14" rx="2" fill="#6366f1" />
          <rect x="49" y="22" width="14" height="14" rx="2" fill="#f59e0b" />
          <rect x="33" y="38" width="14" height="14" rx="2" fill="#8b5cf6" />
          <rect x="33" y="54" width="14" height="7" rx="1.5" fill="#06b6d4" />
        </svg>
      );
    };

    // --- GENERATOR SOAL 3D ACAK & ANTI-DUPLIKAT UNTUK 4 KATEGORI ---
    const buatBalokPadat = (p, l, t, geser = { x: 0, y: 0, z: 0 }) => {
      const daftarKubus = [];
      for (let x = 0; x < p; x++) {
        for (let y = 0; y < l; y++) {
          for (let z = 0; z < t; z++) {
            daftarKubus.push({ x: x + geser.x, y: y + geser.y, z: z + geser.z });
          }
        }
      }
      return daftarKubus;
    };

    const buatTandaBentuk = (kubus) => {
      const minX = Math.min(...kubus.map(c => c.x));
      const minY = Math.min(...kubus.map(c => c.y));
      const minZ = Math.min(...kubus.map(c => c.z));
      return kubus
        .map(c => `${c.x - minX},${c.y - minY},${c.z - minZ}`)
        .sort()
        .join('|');
    };

    const buatPilihanAngka = (jumlahBenar) => {
      const pilihan = new Set([jumlahBenar]);
      const selisih = [-4, -3, -2, -1, 1, 2, 3, 4, 5];
      while (pilihan.size < 4) {
        const acak = selisih[Math.floor(Math.random() * selisih.length)];
        const kandidat = jumlahBenar + acak;
        if (kandidat > 0) pilihan.add(kandidat);
      }
      return Array.from(pilihan).sort(() => Math.random() - 0.5).map(String);
    };

    // 1. Generator Kategori 1: Hitung Kubus Satuan
    const generateHitungKubus = (totalSoal = 20) => {
      const daftarSoal = [];
      const jejakBentuk = new Set();
      let percobaan = 0;

      while (daftarSoal.length < totalSoal && percobaan < 600) {
        percobaan++;
        const tingkat = daftarSoal.length;
        const tipe = Math.floor(Math.random() * 5);
        let kubus = [];
        let pertanyaan = "";
        let pembahasan = "";

        if (tipe === 0) {
          const p = Math.floor(Math.random() * 4) + 2;
          const l = Math.floor(Math.random() * 3) + 1;
          const t = Math.floor(Math.random() * (tingkat > 10 ? 3 : 2)) + 1;
          kubus = buatBalokPadat(p, l, t);
          pertanyaan = `Hitung jumlah seluruh kubus satuan pada susunan balok berukuran ${p} × ${l} × ${t} berikut.`;
          pembahasan = `Rumus volume balok: Panjang (${p}) × Lebar (${l}) × Tinggi (${t}) = ${kubus.length} kubus satuan.`;
        } else if (tipe === 1) {
          const anakTangga = Math.floor(Math.random() * 3) + 3;
          const lebar = Math.floor(Math.random() * 2) + 1;
          const rincian = [];
          for (let s = 0; s < anakTangga; s++) {
            const tinggi = anakTangga - s;
            rincian.push(tinggi * lebar);
            for (let z = 0; z < tinggi; z++) {
              for (let y = 0; y < lebar; y++) {
                kubus.push({ x: s, y, z });
              }
            }
          }
          pertanyaan = `Berapa total kubus satuan yang membentuk bangun anak tangga ini?`;
          pembahasan = `Jumlahkan tiap kolom dari bagian tertinggi ke terendah: ${rincian.join(' + ')} = ${kubus.length} kubus satuan.`;
        } else if (tipe === 2) {
          const p = Math.floor(Math.random() * 2) + 3;
          const l = Math.floor(Math.random() * 2) + 3;
          const t = Math.floor(Math.random() * 2) + 1;
          const utuh = buatBalokPadat(p, l, t);
          const potongX = Math.floor(Math.random() * 2) + 1;
          const potongY = Math.floor(Math.random() * 2) + 1;
          kubus = utuh.filter(c => !(c.x >= p - potongX && c.y >= l - potongY && c.z === t - 1));
          const terpotong = utuh.length - kubus.length;
          pertanyaan = `Balok berukuran ${p} × ${l} × ${t} ini dikurangi ${terpotong} kubus pada sudut atasnya. Berapa sisa kubusnya?`;
          pembahasan = `Balok utuh (${p} × ${l} × ${t} = ${utuh.length}) dikurangi bagian yang hilang (${terpotong}) = ${kubus.length} kubus satuan.`;
        } else if (tipe === 3) {
          const alas = Math.floor(Math.random() * 2) + 3;
          kubus = [
            ...buatBalokPadat(alas, alas, 1),
            ...buatBalokPadat(alas - 1, alas - 1, 1, { x: 0, y: 0, z: 1 })
          ];
          if (tingkat >= 10 && Math.random() > 0.4) {
            kubus.push(...buatBalokPadat(alas - 2, alas - 2, 1, { x: 0, y: 0, z: 2 }));
            pertanyaan = `Hitung total kubus pada menara 3 tingkat ini, termasuk bagian dalam yang tertindih.`;
            pembahasan = `Lapis 1 (${alas * alas}) + Lapis 2 (${(alas - 1) ** 2}) + Lapis 3 (${(alas - 2) ** 2}) = ${kubus.length} kubus satuan.`;
          } else {
            pertanyaan = `Menara 2 tingkat dengan alas ${alas} × ${alas} dan tingkat atas ${alas - 1} × ${alas - 1}. Berapa total kubusnya?`;
            pembahasan = `Lapis bawah (${alas * alas}) + Lapis atas (${(alas - 1) ** 2}) = ${kubus.length} kubus satuan.`;
          }
        } else {
          const ukuranBidang = tingkat > 12 ? 4 : 3;
          const tinggiMaks = tingkat > 8 ? 4 : 3;
          const targetKubus = Math.floor(Math.random() * 8) + (tingkat > 10 ? 10 : 6);
          const tinggiKolom = Array.from({ length: ukuranBidang }, () => Array(ukuranBidang).fill(0));
          let cx = Math.floor(ukuranBidang / 2), cy = Math.floor(ukuranBidang / 2);
          tinggiKolom[cx][cy] = 1;
          let terisi = 1;

          while (terisi < targetKubus) {
            const arah = [[1, 0], [-1, 0], [0, 1], [0, -1], [0, 0]];
            const [dx, dy] = arah[Math.floor(Math.random() * arah.length)];
            const nx = Math.max(0, Math.min(ukuranBidang - 1, cx + dx));
            const ny = Math.max(0, Math.min(ukuranBidang - 1, cy + dy));
            if (tinggiKolom[nx][ny] < tinggiMaks) {
              tinggiKolom[nx][ny]++;
              terisi++;
            }
            cx = nx; cy = ny;
          }

          const hitungPerLapis = Array(tinggiMaks).fill(0);
          for (let x = 0; x < ukuranBidang; x++) {
            for (let y = 0; y < ukuranBidang; y++) {
              for (let z = 0; z < tinggiKolom[x][y]; z++) {
                kubus.push({ x, y, z });
                hitungPerLapis[z]++;
              }
            }
          }
          const rincianLapis = hitungPerLapis.filter(n => n > 0).map((n, idx) => `Lapis ${idx + 1} (${n})`);
          pertanyaan = `Putar objek 3D ini dari berbagai sisi, lalu hitung total kubus penyusunnya (termasuk yang tersembunyi di bawah).`;
          pembahasan = `Rincian tiap tingkatan warna: ${rincianLapis.join(' + ')} = ${kubus.length} kubus satuan.`;
        }

        const tanda = buatTandaBentuk(kubus);
        if (kubus.length >= 4 && !jejakBentuk.has(tanda)) {
          jejakBentuk.add(tanda);
          daftarSoal.push({
            id: daftarSoal.length + 1,
            kategori: 'hitung-kubus',
            modeRender: 'kubus',
            pertanyaan,
            pilihan: buatPilihanAngka(kubus.length),
            jawabanBenar: String(kubus.length),
            kubus,
            pembahasan
          });
        }
      }
      return daftarSoal;
    };

    // 2. Generator Kategori 2: Melengkapi Bangun Ruang (Kerangka Batas)
    const generateLengkapiBalok = (totalSoal = 20) => {
      const daftarSoal = [];
      const jejak = new Set();
      let percobaan = 0;

      while (daftarSoal.length < totalSoal && percobaan < 600) {
        percobaan++;
        const tingkat = daftarSoal.length;
        const p = Math.floor(Math.random() * 2) + 3;
        const l = Math.floor(Math.random() * 2) + 2;
        const t = tingkat > 8 ? 3 : 2;
        const kapasitasTotal = p * l * t;

        const kubus = [];
        for (let x = 0; x < p; x++) {
          for (let y = 0; y < l; y++) {
            const maksKolom = (x === 0 && y === 0) ? t : Math.floor(Math.random() * (t + 1));
            for (let z = 0; z < maksKolom; z++) {
              kubus.push({ x, y, z });
            }
          }
        }

        const kosong = kapasitasTotal - kubus.length;
        const tanda = `${p}x${l}x${t}|${buatTandaBentuk(kubus)}`;
        if (kubus.length >= 3 && kosong >= 3 && !jejak.has(tanda)) {
          jejak.add(tanda);
          daftarSoal.push({
            id: daftarSoal.length + 1,
            kategori: 'lengkapi-balok',
            modeRender: 'kerangka',
            batas: { p, l, t },
            pertanyaan: `Berapa kubus satuan tambahan yang diperlukan untuk memenuhi kerangka balok berukuran ${p} × ${l} × ${t} ini?`,
            pilihan: buatPilihanAngka(kosong),
            jawabanBenar: String(kosong),
            kubus,
            pembahasan: `Kapasitas penuh kerangka = ${p} × ${l} × ${t} = ${kapasitasTotal} kubus. Sudah terisi ${kubus.length} kubus, sehingga ruang kosongnya = ${kapasitasTotal} - ${kubus.length} = ${kosong} kubus.`
          });
        }
      }
      return daftarSoal;
    };

    // 3. Generator Kategori 3: Proyeksi Tampak 2D (Ortogonal)
    const generateProyeksi2D = (totalSoal = 20) => {
      const daftarSoal = [];
      const jejak = new Set();
      let percobaan = 0;

      const klonGrid = (g) => g.map(baris => [...baris]);
      const serialGrid = (g) => g.map(b => b.join('')).join('/');

      while (daftarSoal.length < totalSoal && percobaan < 700) {
        percobaan++;
        const ukuran = 3;
        const tinggiMaks = 3;
        const tinggiKolom = Array.from({ length: ukuran }, () => Array(ukuran).fill(0));
        const jumlahKubus = Math.floor(Math.random() * 5) + 6;

        let cx = 1, cy = 1;
        tinggiKolom[cx][cy] = 1;
        let terisi = 1;
        while (terisi < jumlahKubus) {
          const arah = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          const [dx, dy] = arah[Math.floor(Math.random() * arah.length)];
          const nx = Math.max(0, Math.min(ukuran - 1, cx + dx));
          const ny = Math.max(0, Math.min(ukuran - 1, cy + dy));
          if (tinggiKolom[nx][ny] < tinggiMaks) {
            tinggiKolom[nx][ny]++;
            terisi++;
          }
          cx = nx; cy = ny;
        }

        const kubus = [];
        for (let x = 0; x < ukuran; x++) {
          for (let y = 0; y < ukuran; y++) {
            for (let z = 0; z < tinggiKolom[x][y]; z++) {
              kubus.push({ x, y, z });
            }
          }
        }

        const jenisTampak = Math.random() > 0.45 ? 'atas' : 'depan';
        let gridBenar = Array.from({ length: 3 }, () => Array(3).fill(0));

        if (jenisTampak === 'atas') {
          for (let y = 0; y < 3; y++) {
            for (let x = 0; x < 3; x++) {
              gridBenar[y][x] = tinggiKolom[x][y];
            }
          }
        } else {
          for (let x = 0; x < 3; x++) {
            for (let z = 0; z < 3; z++) {
              let lapisTerdepan = 0;
              for (let y = 2; y >= 0; y--) {
                if (tinggiKolom[x][y] > z) {
                  lapisTerdepan = z + 1;
                  break;
                }
              }
              gridBenar[2 - z][x] = lapisTerdepan;
            }
          }
        }

        const tanda = `${jenisTampak}|${buatTandaBentuk(kubus)}`;
        const kunciBenar = serialGrid(gridBenar);
        if (jejak.has(tanda) || kunciBenar === '000/000/000') continue;

        const daftarGrid = [gridBenar];
        const jejakOpsi = new Set([kunciBenar]);
        let cobaOpsi = 0;
        while (daftarGrid.length < 4 && cobaOpsi < 100) {
          cobaOpsi++;
          const kandidat = klonGrid(gridBenar);
          const modeMutasi = cobaOpsi % 3;
          if (modeMutasi === 0) {
            kandidat.forEach(b => b.reverse());
          } else if (modeMutasi === 1) {
            const r1 = Math.floor(Math.random() * 3), c1 = Math.floor(Math.random() * 3);
            kandidat[r1][c1] = kandidat[r1][c1] > 0 ? 0 : (Math.floor(Math.random() * 2) + 1);
          } else {
            for (let r = 0; r < 3; r++) {
              for (let c = r + 1; c < 3; c++) {
                [kandidat[r][c], kandidat[c][r]] = [kandidat[c][r], kandidat[r][c]];
              }
            }
          }
          const s = serialGrid(kandidat);
          if (!jejakOpsi.has(s) && s !== '000/000/000') {
            jejakOpsi.add(s);
            daftarGrid.push(kandidat);
          }
        }

        if (daftarGrid.length === 4) {
          jejak.add(tanda);
          const opsiAcak = daftarGrid
            .map((grid, idx) => ({ id: String(idx), grid, benar: idx === 0 }))
            .sort(() => Math.random() - 0.5);
          const jawabanBenar = opsiAcak.find(o => o.benar).id;

          daftarSoal.push({
            id: daftarSoal.length + 1,
            kategori: 'proyeksi-2d',
            modeRender: 'proyeksi',
            jenisTampak,
            pertanyaan: jenisTampak === 'atas'
              ? 'Gunakan tombol sudut "Atas" atau bayangkan dari atas. Manakah proyeksi Tampak Atas yang tepat?'
              : 'Gunakan tombol sudut "Depan" atau bayangkan dari muka. Manakah proyeksi Tampak Depan yang tepat?',
            pilihan: opsiAcak,
            jawabanBenar,
            kubus,
            pembahasan: jenisTampak === 'atas'
              ? 'Proyeksi Tampak Atas memetakan setiap kolom yang terisi kubus dari atas ke bawah sesuai warna lapisan tertingginya.'
              : 'Proyeksi Tampak Depan menampilkan siluet ketinggian tiap kolom dari kiri ke kanan tanpa memperhatikan kedalaman belakang.'
          });
        }
      }
      return daftarSoal;
    };

    // 4. Generator Kategori 4: Jaring-Jaring Kubus (6 Sisi Berwarna & Bersimbol)
    const SISI_KUBUS_DEF = [
      { id: 0, nama: 'Kanan', warna: '#6366f1', simbol: '●' },
      { id: 1, nama: 'Kiri', warna: '#10b981', simbol: '▲' },
      { id: 2, nama: 'Atas', warna: '#f59e0b', simbol: '■' },
      { id: 3, nama: 'Bawah', warna: '#ef4444', simbol: '◆' },
      { id: 4, nama: 'Depan', warna: '#8b5cf6', simbol: '★' },
      { id: 5, nama: 'Belakang', warna: '#06b6d4', simbol: '✚' }
    ];

    const TEMPLATE_JARING = [
      [
        { r: 0, c: 1, sisi: 2 },
        { r: 1, c: 0, sisi: 1 }, { r: 1, c: 1, sisi: 4 }, { r: 1, c: 2, sisi: 0 }, { r: 1, c: 3, sisi: 5 },
        { r: 2, c: 1, sisi: 3 }
      ],
      [
        { r: 0, c: 0, sisi: 2 },
        { r: 1, c: 0, sisi: 1 }, { r: 1, c: 1, sisi: 4 }, { r: 1, c: 2, sisi: 0 }, { r: 1, c: 3, sisi: 5 },
        { r: 2, c: 2, sisi: 3 }
      ],
      [
        { r: 0, c: 0, sisi: 2 }, { r: 0, c: 1, sisi: 5 },
        { r: 1, c: 1, sisi: 4 }, { r: 1, c: 2, sisi: 0 },
        { r: 2, c: 2, sisi: 3 }, { r: 2, c: 3, sisi: 1 }
      ],
      [
        { r: 0, c: 1, sisi: 2 },
        { r: 1, c: 0, sisi: 1 }, { r: 1, c: 1, sisi: 4 }, { r: 1, c: 2, sisi: 0 },
        { r: 2, c: 2, sisi: 3 }, { r: 2, c: 3, sisi: 5 }
      ]
    ];

    const generateJaringKubus = (totalSoal = 20) => {
      const daftarSoal = [];
      const jejak = new Set();
      let percobaan = 0;

      while (daftarSoal.length < totalSoal && percobaan < 400) {
        percobaan++;
        const permutasi = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
        const kunci = permutasi.join('-');
        if (jejak.has(kunci)) continue;
        jejak.add(kunci);

        const profilSisi = permutasi.map(idx => SISI_KUBUS_DEF[idx]);
        const templateBenar = TEMPLATE_JARING[Math.floor(Math.random() * TEMPLATE_JARING.length)];

        const daftarJaring = [
          { id: '0', pola: templateBenar, profil: profilSisi, benar: true }
        ];

        const pasanganTukar = [[0, 1], [2, 3], [4, 5]];
        pasanganTukar.forEach(([sA], idx) => {
          const profilSalah = [...profilSisi];
          const tetangga = (sA + 2) % 6;
          [profilSalah[sA], profilSalah[tetangga]] = [profilSalah[tetangga], profilSalah[sA]];
          const tmpl = TEMPLATE_JARING[(idx + 1) % TEMPLATE_JARING.length];
          daftarJaring.push({
            id: String(idx + 1),
            pola: tmpl,
            profil: profilSalah,
            benar: false
          });
        });

        const opsiAcak = daftarJaring.sort(() => Math.random() - 0.5);
        const jawabanBenar = opsiAcak.find(o => o.benar).id;

        daftarSoal.push({
          id: daftarSoal.length + 1,
          kategori: 'jaring-kubus',
          modeRender: 'jaring',
          profilSisi,
          kubus: [{ x: 0, y: 0, z: 0 }],
          pertanyaan: 'Putar kubus 3D di samping untuk melihat seluruh sisinya. Manakah jaring-jaring 2D yang membentuk kubus tersebut?',
          pilihan: opsiAcak,
          jawabanBenar,
          pembahasan: `Ingat aturan jaring kubus: sisi yang berhadapan (${profilSisi[2].simbol} Atas & ${profilSisi[3].simbol} Bawah, ${profilSisi[1].simbol} Kiri & ${profilSisi[0].simbol} Kanan, ${profilSisi[4].simbol} Depan & ${profilSisi[5].simbol} Belakang) dipisahkan tepat satu petak saat dibentangkan.`
        });
      }
      return daftarSoal;
    };

    const buatSoalPerKategori = (idKategori) => {
      if (idKategori === 'lengkapi-balok') return generateLengkapiBalok(20);
      if (idKategori === 'proyeksi-2d') return generateProyeksi2D(20);
      if (idKategori === 'jaring-kubus') return generateJaringKubus(20);
      return generateHitungKubus(20);
    };

    // --- KOMPONEN VISUAL OPSI 2D (UNTUK KATEGORI 3 & 4) ---
    const VisualOpsiProyeksi = ({ grid }) => (
      <div className="grid grid-cols-3 gap-1 p-1.5 bg-stone-200/70 dark:bg-stone-800/80 rounded-lg border border-stone-300/60 dark:border-stone-700/60">
        {grid.flat().map((nilai, idx) => {
          const warna = nilai > 0 ? LAYER_PALETTE[(nilai - 1) % LAYER_PALETTE.length].css : 'transparent';
          return (
            <div
              key={idx}
              className="w-5 h-5 sm:w-6 sm:h-6 rounded-xs border border-stone-300/80 dark:border-stone-700"
              style={{ backgroundColor: warna }}
            />
          );
        })}
      </div>
    );

    const VisualOpsiJaring = ({ pola, profil }) => {
      const peta = {};
      pola.forEach(item => { peta[`${item.r}-${item.c}`] = profil[item.sisi]; });
      return (
        <div className="grid grid-cols-4 gap-0.5 p-1">
          {[0, 1, 2].map(r =>
            [0, 1, 2, 3].map(c => {
              const sel = peta[`${r}-${c}`];
              if (!sel) return <div key={`${r}-${c}`} className="w-5 h-5 sm:w-6 sm:h-6" />;
              return (
                <div
                  key={`${r}-${c}`}
                  className="w-5 h-5 sm:w-6 sm:h-6 rounded-xs flex items-center justify-center text-[10px] sm:text-xs font-bold text-white shadow-2xs"
                  style={{ backgroundColor: sel.warna }}
                >
                  {sel.simbol}
                </div>
              );
            })
          )}
        </div>
      );
    };

    // --- KOMPONEN PANGGUNG 3D (MENDUKUNG 4 MODE VISUAL) ---
    const PanggungKubus3D = ({ soal, putarOtomatis, modeGelap, sudutKamera, saatGeserManual }) => {
      const wadahRef = useRef(null);
      const rendererRef = useRef(null);
      const sceneRef = useRef(null);
      const kameraRef = useRef(null);
      const grupKubusRef = useRef(null);
      const putarRef = useRef(putarOtomatis);
      const [galatWebGL, setGalatWebGL] = useState(false);

      useEffect(() => { putarRef.current = putarOtomatis; }, [putarOtomatis]);

      useEffect(() => {
        if (!sceneRef.current || !window.THREE) return;
        sceneRef.current.background = new window.THREE.Color(modeGelap ? 0x141413 : 0xEFECE6);
        if (grupKubusRef.current) perbaruiSusunanKubus();
      }, [modeGelap]);

      useEffect(() => {
        if (!grupKubusRef.current || !sudutKamera) return;
        if (sudutKamera.tipe === 'isometrik') {
          grupKubusRef.current.rotation.set(0.52, 0.78, 0);
        } else if (sudutKamera.tipe === 'atas') {
          grupKubusRef.current.rotation.set(Math.PI / 2 - 0.01, 0, 0);
        } else if (sudutKamera.tipe === 'depan') {
          grupKubusRef.current.rotation.set(0.02, 0, 0);
        }
      }, [sudutKamera]);

      useEffect(() => {
        let idAnimasi;
        let pengamatUkuran;
        if (!wadahRef.current || !window.THREE) return;

        try {
          const lebar = wadahRef.current.clientWidth || 400;
          const tinggi = wadahRef.current.clientHeight || 300;
          const THREE = window.THREE;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(modeGelap ? 0x141413 : 0xEFECE6);
          sceneRef.current = scene;

          const kamera = new THREE.PerspectiveCamera(40, lebar / tinggi, 0.1, 1000);
          kamera.position.set(11.5, 9.5, 11.5);
          kamera.lookAt(0, 0, 0);
          kameraRef.current = kamera;

          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(lebar, tinggi);
          rendererRef.current = renderer;
          wadahRef.current.appendChild(renderer.domElement);

          scene.add(new THREE.AmbientLight(0xffffff, 0.85));
          const cahayaUtama = new THREE.DirectionalLight(0xffffff, 0.5);
          cahayaUtama.position.set(12, 22, 14);
          scene.add(cahayaUtama);
          const cahayaIsi = new THREE.DirectionalLight(0xffffff, 0.25);
          cahayaIsi.position.set(-12, -8, -10);
          scene.add(cahayaIsi);

          const grup = new THREE.Group();
          scene.add(grup);
          grupKubusRef.current = grup;

          perbaruiSusunanKubus();

          let sedangGeser = false;
          let posisiAwal = { x: 0, y: 0 };

          const mulaiGeser = (e) => {
            sedangGeser = true;
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            posisiAwal = { x: clientX, y: clientY };
            if (saatGeserManual) saatGeserManual();
          };

          const saatGeser = (e) => {
            if (!sedangGeser) return;
            if (e.cancelable) e.preventDefault();
            const x = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
            const y = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            grup.rotation.y += (x - posisiAwal.x) * 0.011;
            grup.rotation.x += (y - posisiAwal.y) * 0.011;
            posisiAwal = { x, y };
          };

          const selesaiGeser = () => { sedangGeser = false; };

          const elemen = wadahRef.current;
          elemen.addEventListener('mousedown', mulaiGeser);
          window.addEventListener('mousemove', saatGeser);
          window.addEventListener('mouseup', selesaiGeser);
          elemen.addEventListener('touchstart', mulaiGeser, { passive: false });
          elemen.addEventListener('touchmove', saatGeser, { passive: false });
          window.addEventListener('touchend', selesaiGeser);

          const jalankanAnimasi = () => {
            idAnimasi = requestAnimationFrame(jalankanAnimasi);
            if (putarRef.current && !sedangGeser && grupKubusRef.current) {
              grupKubusRef.current.rotation.y += 0.0065;
            }
            if (rendererRef.current && sceneRef.current && kameraRef.current) {
              rendererRef.current.render(sceneRef.current, kameraRef.current);
            }
          };
          jalankanAnimasi();

          const saatUbahUkuran = () => {
            if (!wadahRef.current || !kameraRef.current || !rendererRef.current) return;
            const w = wadahRef.current.clientWidth;
            const h = wadahRef.current.clientHeight;
            if (w === 0 || h === 0) return;
            kameraRef.current.aspect = w / h;
            kameraRef.current.updateProjectionMatrix();
            rendererRef.current.setSize(w, h);
          };

          if (typeof ResizeObserver !== 'undefined') {
            pengamatUkuran = new ResizeObserver(saatUbahUkuran);
            pengamatUkuran.observe(elemen);
          }
          window.addEventListener('resize', saatUbahUkuran);

          return () => {
            cancelAnimationFrame(idAnimasi);
            if (pengamatUkuran) pengamatUkuran.disconnect();
            elemen.removeEventListener('mousedown', mulaiGeser);
            window.removeEventListener('mousemove', saatGeser);
            window.removeEventListener('mouseup', selesaiGeser);
            elemen.removeEventListener('touchstart', mulaiGeser);
            elemen.removeEventListener('touchmove', saatGeser);
            window.removeEventListener('touchend', selesaiGeser);
            window.removeEventListener('resize', saatUbahUkuran);
            if (rendererRef.current && wadahRef.current) {
              wadahRef.current.innerHTML = "";
              rendererRef.current.dispose();
            }
          };
        } catch (err) {
          setGalatWebGL(true);
        }
      }, []);

      useEffect(() => { if (grupKubusRef.current) perbaruiSusunanKubus(); }, [soal]);

      const buatTeksturSisi = (THREE, warnaHex, simbol) => {
        const kanvas = document.createElement('canvas');
        kanvas.width = 256;
        kanvas.height = 256;
        const ctx = kanvas.getContext('2d');
        ctx.fillStyle = warnaHex;
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, 244, 244);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 124px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(simbol, 128, 134);
        return new THREE.CanvasTexture(kanvas);
      };

      const perbaruiSusunanKubus = () => {
        const THREE = window.THREE;
        if (!THREE || !grupKubusRef.current || !soal) return;
        const grup = grupKubusRef.current;
        while (grup.children.length > 0) grup.remove(grup.children[0]);

        if (soal.modeRender === 'jaring') {
          const geometriBesar = new THREE.BoxGeometry(3.2, 3.2, 3.2);
          const bahanSisi = soal.profilSisi.map(s =>
            new THREE.MeshBasicMaterial({ map: buatTeksturSisi(THREE, s.warna, s.simbol) })
          );
          const kubusTunggal = new THREE.Mesh(geometriBesar, bahanSisi);
          grup.add(kubusTunggal);
          grup.rotation.set(0.45, -0.65, 0);
          return;
        }

        const kubus = soal.kubus;
        const geometri = new THREE.BoxGeometry(0.96, 0.96, 0.96);

        let cx = 0, cy = 0, cz = 0;
        if (soal.modeRender === 'kerangka' && soal.batas) {
          cx = (soal.batas.p - 1) / 2;
          cy = (soal.batas.l - 1) / 2;
          cz = (soal.batas.t - 1) / 2;
        } else {
          let minX = 0, maxX = 0, minY = 0, maxY = 0, minZ = 0, maxZ = 0;
          kubus.forEach(c => {
            minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
            minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
            minZ = Math.min(minZ, c.z); maxZ = Math.max(maxZ, c.z);
          });
          cx = (minX + maxX) / 2;
          cy = (minY + maxY) / 2;
          cz = (minZ + maxZ) / 2;
        }

        kubus.forEach((posisi) => {
          const indeksLapis = Math.round(posisi.z);
          const warna = LAYER_PALETTE[indeksLapis % LAYER_PALETTE.length].hex;
          const kubusMesh = new THREE.Mesh(
            geometri,
            new THREE.MeshPhongMaterial({ color: warna, shininess: 65 })
          );
          kubusMesh.position.set(posisi.x - cx, posisi.z - cz, posisi.y - cy);
          const garisTepi = new THREE.LineSegments(
            new THREE.EdgesGeometry(geometri),
            new THREE.LineBasicMaterial({
              color: modeGelap ? 0x111110 : 0xFFFFFF,
              transparent: true,
              opacity: modeGelap ? 0.5 : 0.65
            })
          );
          kubusMesh.add(garisTepi);
          grup.add(kubusMesh);
        });

        if (soal.modeRender === 'kerangka' && soal.batas) {
          const { p, l, t } = soal.batas;
          const geoBatas = new THREE.BoxGeometry(p, t, l);
          const garisBatas = new THREE.LineSegments(
            new THREE.EdgesGeometry(geoBatas),
            new THREE.LineBasicMaterial({
              color: 0xD94E1F,
              transparent: true,
              opacity: 0.9
            })
          );
          grup.add(garisBatas);
        }

        grup.rotation.set(0.52, 0.78, 0);
      };

      return (
        <div className="relative w-full h-full">
          {galatWebGL ? (
            <div className="w-full h-full flex items-center justify-center p-6 text-center text-xs text-stone-500">
              Tampilan 3D tidak didukung oleh peramban perangkat ini.
            </div>
          ) : (
            <div ref={wadahRef} className="w-full h-full cursor-grab active:cursor-grabbing touch-none" />
          )}
        </div>
      );
    };

    // --- KOMPONEN MODAL DAFTAR SOAL ---
    const ModalDaftarSoal = ({ buka, tutup, daftarSoal, indeksAktif, jawabanUser, pilihSoal }) => {
      useEffect(() => {
        if (!buka) return;
        const saatEsc = (e) => { if (e.key === 'Escape') tutup(); };
        window.addEventListener('keydown', saatEsc);
        return () => window.removeEventListener('keydown', saatEsc);
      }, [buka, tutup]);

      if (!buka) return null;
      const jumlahTerjawab = Object.keys(jawabanUser).length;

      return (
        <div
          onClick={tutup}
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white dark:bg-charcoal border border-[#E2E0D8] dark:border-[#2C2C29] w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl"
          >
            <div className="flex items-center justify-between pb-4 mb-5 border-b border-[#E8E6DF] dark:border-[#2A2A27]">
              <div>
                <h2 className="text-base font-bold tracking-tight">Peta Nomor Soal</h2>
                <p className="text-xs text-stone-500 dark:text-stone-400 font-mono mt-0.5">
                  {jumlahTerjawab} dari 20 soal selesai
                </p>
              </div>
              <button
                onClick={tutup}
                aria-label="Tutup daftar soal"
                className="p-2 rounded-lg border border-[#E2E0D8] dark:border-[#2C2C29] hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors"
              >
                <Ikon nama="tutup" ukuran={16} />
              </button>
            </div>

            <div className="grid grid-cols-5 gap-2 max-h-[60vh] overflow-y-auto custom-scrollbar">
              {daftarSoal.map((item, i) => {
                const sudahDijawab = jawabanUser[i] !== undefined;
                const benar = jawabanUser[i] === item.jawabanBenar;
                let gayaKotak = "bg-paper dark:bg-obsidian border-[#DFDDD4] dark:border-[#2C2C29] text-stone-600 dark:text-stone-400 hover:border-ink dark:hover:border-stone-400";

                if (indeksAktif === i) {
                  gayaKotak = "bg-ink dark:bg-[#F2F1ED] border-ink dark:border-[#F2F1ED] text-white dark:text-obsidian";
                } else if (sudahDijawab) {
                  gayaKotak = benar
                    ? "bg-emerald-50 dark:bg-emerald-950/60 border-emerald-600/50 text-emerald-700 dark:text-emerald-400"
                    : "bg-red-50 dark:bg-red-950/60 border-red-600/50 text-red-700 dark:text-red-400";
                }

                return (
                  <button
                    key={i}
                    onClick={() => pilihSoal(i)}
                    className={`h-11 rounded-lg border font-mono text-sm font-bold transition-colors ${gayaKotak}`}
                  >
                    {String(i + 1).padStart(2, '0')}
                  </button>
                );
              })}
            </div>

            <div className="mt-5 pt-4 border-t border-[#E8E6DF] dark:border-[#2A2A27] flex items-center justify-between text-[11px] font-medium text-stone-500 dark:text-stone-400">
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-xs bg-ink dark:bg-[#F2F1ED]" /> Aktif</span>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-xs bg-emerald-600" /> Benar</span>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-xs bg-red-600" /> Salah</span>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-xs border border-stone-400" /> Kosong</span>
            </div>
          </div>
        </div>
      );
    };

    // --- KOMPONEN HALAMAN BERANDA (PILIH 4 KATEGORI) ---
    const HalamanBeranda = ({ pilihKategori, skorTerbaik, modeGelap, toggleTema }) => {
      return (
        <div className="min-h-[100dvh] h-[100dvh] overflow-y-auto bg-paper dark:bg-obsidian text-ink dark:text-[#F2F1ED] flex flex-col justify-between transition-colors duration-200 custom-scrollbar">
          {/* HEADER BERANDA */}
          <header className="w-full border-b border-[#DFDDD4] dark:border-[#262624] bg-white/80 dark:bg-charcoal/80 backdrop-blur-md sticky top-0 z-20">
            <div className="max-w-5xl mx-auto px-5 sm:px-8 h-15 sm:h-16 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="w-3 h-3 rounded-xs bg-terracotta inline-block" />
                <span className="font-bold text-sm sm:text-base tracking-tight">Studio Spasial 3D</span>
              </div>

              <button
                onClick={toggleTema}
                className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-[#DFDDD4] dark:border-[#2C2C29] bg-paper dark:bg-obsidian hover:border-ink dark:hover:border-stone-500 text-xs font-semibold transition-colors"
              >
                <Ikon nama={modeGelap ? 'matahari' : 'bulan'} ukuran={14} />
                <span>{modeGelap ? 'Mode Terang' : 'Mode Gelap'}</span>
              </button>
            </div>
          </header>

          {/* KONTEN UTAMA BERANDA */}
          <main className="max-w-5xl w-full mx-auto px-5 sm:px-8 py-8 sm:py-12 my-auto">
            <div className="max-w-2xl mb-8 sm:mb-10">
              <p className="font-mono text-xs font-bold uppercase tracking-widest text-terracotta mb-2.5">
                Bank Soal Geometri & Psikotes Spasial
              </p>
              <h1 className="text-3xl sm:text-4xl lg:text-[42px] font-bold tracking-tight leading-[1.12] mb-3.5">
                Pilih Kategori Latihan Penalaran Ruang 3D
              </h1>
              <p className="text-sm sm:text-base text-stone-600 dark:text-stone-400 leading-relaxed">
                Setiap modul menyusun 20 soal bangun ruang interaktif secara acak tanpa pengulangan bentuk. Putar objek 3D secara bebas untuk melatih ketajaman visualisasi ruang Anda.
              </p>
            </div>

            {/* GRID 4 KARTU KATEGORI */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
              {KATEGORI_SOAL.map((kat) => {
                const nilaiTertinggi = skorTerbaik[kat.id];
                return (
                  <button
                    key={kat.id}
                    onClick={() => pilihKategori(kat)}
                    className="group text-left bg-white dark:bg-charcoal border border-[#DFDDD4] dark:border-[#2A2A27] hover:border-ink dark:hover:border-stone-400 rounded-2xl p-5 sm:p-6 transition-all flex flex-col justify-between shadow-2xs hover:shadow-md active:scale-[0.99]"
                  >
                    <div>
                      <div className="flex items-start justify-between gap-4 mb-4">
                        <div className="flex flex-col gap-1.5">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-[11px] font-bold uppercase tracking-wider text-terracotta">
                              {kat.kode}
                            </span>
                            <span className="text-stone-300 dark:text-stone-700">•</span>
                            <span className="font-mono text-[11px] font-medium text-stone-500 dark:text-stone-400">
                              {kat.tag}
                            </span>
                          </div>
                          <h2 className="text-lg sm:text-xl font-bold tracking-tight group-hover:text-terracotta transition-colors">
                            {kat.judul}
                          </h2>
                        </div>
                        <div className="shrink-0 p-2 rounded-xl bg-paper dark:bg-obsidian border border-[#EAE8E1] dark:border-[#262624]">
                          <IlustrasiKategori id={kat.id} />
                        </div>
                      </div>

                      <p className="text-xs sm:text-sm text-stone-600 dark:text-stone-400 leading-relaxed mb-6">
                        {kat.deskripsi}
                      </p>
                    </div>

                    <div className="pt-4 border-t border-[#EAE8E1] dark:border-[#262624] flex items-center justify-between">
                      <div className="flex items-center gap-3 font-mono text-xs">
                        <span className="text-stone-500 dark:text-stone-400">20 Soal Acak</span>
                        {nilaiTertinggi !== undefined && (
                          <span className="px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 font-bold">
                            Rekor: {nilaiTertinggi}%
                          </span>
                        )}
                      </div>

                      <span className="inline-flex items-center gap-1.5 text-xs font-bold tracking-wide group-hover:translate-x-1 transition-transform">
                        Mulai Latihan
                        <Ikon nama="kanan" ukuran={15} />
                      </span>
                    </div>
                  </button>
                );
              })}
            </div>
          </main>

          {/* FOOTER BERANDA */}
          <footer className="w-full border-t border-[#DFDDD4] dark:border-[#262624]">
            <div className="max-w-5xl mx-auto px-5 sm:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-mono text-stone-500">
              <span>4 Modul Penalaran Spasial Interaktif</span>
              <span>Kompatibel Layar Sentuh & Desktop</span>
            </div>
          </footer>
        </div>
      );
    };

    // --- KOMPONEN UTAMA APLIKASI REACT ---
    const AplikasiSpasial3D = () => {
      // Default selalu dimulai di Mode Terang (Light Mode)
      const [tema, setTema] = useState('terang');
      const modeGelap = tema === 'gelap';

      useEffect(() => {
        document.documentElement.classList.toggle('dark', modeGelap);
      }, [modeGelap]);

      const [skorTerbaik, setSkorTerbaik] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('spasial3d_rekor') || '{}');
        } catch {
          return {};
        }
      });

      const [kategoriAktif, setKategoriAktif] = useState(null);
      const [daftarSoal, setDaftarSoal] = useState([]);
      const [indeksSoal, setIndeksSoal] = useState(0);
      const [jawabanUser, setJawabanUser] = useState({});
      const [tampilHasil, setTampilHasil] = useState(false);
      const [putarOtomatis, setPutarOtomatis] = useState(true);
      const [bukaModalSoal, setBukaModalSoal] = useState(false);
      const [sudutKamera, setSudutKamera] = useState({ tipe: 'isometrik', waktu: 0 });
      const [sudutAktif, setSudutAktif] = useState('isometrik');
      const panelSoalRef = useRef(null);

      const mulaiKategori = (kategori) => {
        setKategoriAktif(kategori);
        setDaftarSoal(buatSoalPerKategori(kategori.id));
        setIndeksSoal(0);
        setJawabanUser({});
        setTampilHasil(false);
        setPutarOtomatis(true);
        setSudutAktif('isometrik');
      };

      const kembaliKeBeranda = () => {
        setKategoriAktif(null);
        setTampilHasil(false);
        setBukaModalSoal(false);
      };

      const soalAktif = daftarSoal[indeksSoal];
      const sudahDijawab = soalAktif ? jawabanUser[indeksSoal] !== undefined : false;
      const jawabanTepat = soalAktif ? jawabanUser[indeksSoal] === soalAktif.jawabanBenar : false;

      const totalSkor = useMemo(() => {
        if (!daftarSoal.length) return 0;
        return Object.keys(jawabanUser).reduce((total, idx) => {
          return total + (jawabanUser[idx] === daftarSoal[idx].jawabanBenar ? 1 : 0);
        }, 0);
      }, [jawabanUser, daftarSoal]);

      const lapisTertinggi = useMemo(() => {
        if (!soalAktif || !soalAktif.kubus) return 1;
        return Math.max(...soalAktif.kubus.map(c => c.z)) + 1;
      }, [soalAktif]);

      useEffect(() => {
        if (panelSoalRef.current) {
          panelSoalRef.current.scrollTop = 0;
        }
        setSudutAktif('isometrik');
      }, [indeksSoal]);

      const pilihJawaban = useCallback((opsiId) => {
        if (sudahDijawab) return;
        setJawabanUser(prev => ({ ...prev, [indeksSoal]: opsiId }));
      }, [sudahDijawab, indeksSoal]);

      const soalBerikutnya = useCallback(() => {
        if (indeksSoal < 19) {
          setIndeksSoal(prev => prev + 1);
        } else {
          const persentase = Math.round((totalSkor / 20) * 100);
          if (kategoriAktif) {
            setSkorTerbaik(prev => {
              const terbaru = { ...prev, [kategoriAktif.id]: Math.max(prev[kategoriAktif.id] || 0, persentase) };
              try { localStorage.setItem('spasial3d_rekor', JSON.stringify(terbaru)); } catch {}
              return terbaru;
            });
          }
          setTampilHasil(true);
        }
      }, [indeksSoal, totalSkor, kategoriAktif]);

      const soalSebelumnya = useCallback(() => {
        if (indeksSoal > 0) {
          setIndeksSoal(prev => prev - 1);
        }
      }, [indeksSoal]);

      const ulangiDenganSoalBaru = () => {
        if (!kategoriAktif) return;
        setDaftarSoal(buatSoalPerKategori(kategoriAktif.id));
        setJawabanUser({});
        setIndeksSoal(0);
        setTampilHasil(false);
        setPutarOtomatis(true);
        setSudutAktif('isometrik');
      };

      // Pintasan papan ketik
      useEffect(() => {
        const tanganiTombol = (e) => {
          if (!kategoriAktif || tampilHasil || bukaModalSoal || !soalAktif) return;
          if (e.key === 'ArrowRight') soalBerikutnya();
          else if (e.key === 'ArrowLeft') soalSebelumnya();
          else if (e.key === ' ') {
            e.preventDefault();
            setPutarOtomatis(p => !p);
          } else if (!sudahDijawab) {
            const petaTombol = { '1': 0, 'a': 0, '2': 1, 'b': 1, '3': 2, 'c': 2, '4': 3, 'd': 3 };
            const idxOpsi = petaTombol[e.key.toLowerCase()];
            if (idxOpsi !== undefined && soalAktif.pilihan[idxOpsi] !== undefined) {
              const itemOpsi = soalAktif.pilihan[idxOpsi];
              const nilaiOpsi = typeof itemOpsi === 'object' ? itemOpsi.id : itemOpsi;
              pilihJawaban(nilaiOpsi);
            }
          }
        };
        window.addEventListener('keydown', tanganiTombol);
        return () => window.removeEventListener('keydown', tanganiTombol);
      }, [kategoriAktif, tampilHasil, bukaModalSoal, sudahDijawab, soalAktif, soalBerikutnya, soalSebelumnya, pilihJawaban]);

      const ubahSudut = (tipe) => {
        setPutarOtomatis(false);
        setSudutAktif(tipe);
        setSudutKamera({ tipe, waktu: Date.now() });
      };

      // TAMPILKAN BERANDA JIKA BELUM ADA KATEGORI DIPILIH
      if (!kategoriAktif) {
        return (
          <HalamanBeranda
            pilihKategori={mulaiKategori}
            skorTerbaik={skorTerbaik}
            modeGelap={modeGelap}
            toggleTema={() => setTema(modeGelap ? 'terang' : 'gelap')}
          />
        );
      }

      // TAMPILAN RINGKASAN HASIL AKHIR
      if (tampilHasil) {
        const persentase = Math.round((totalSkor / 20) * 100);
        return (
          <div className="min-h-[100dvh] bg-paper dark:bg-obsidian flex flex-col justify-between p-5 sm:p-10 transition-colors duration-200 overflow-y-auto">
            <header className="max-w-xl w-full mx-auto flex items-center justify-between pb-4 border-b border-[#DFDDD4] dark:border-[#2A2A27]">
              <button
                onClick={kembaliKeBeranda}
                className="flex items-center gap-2 text-xs font-bold text-stone-600 dark:text-stone-400 hover:text-ink dark:hover:text-white transition-colors"
              >
                <Ikon nama="beranda" ukuran={15} />
                <span>Beranda</span>
              </button>
              <button
                onClick={() => setTema(modeGelap ? 'terang' : 'gelap')}
                className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-[#DFDDD4] dark:border-[#2C2C29] text-xs font-semibold hover:bg-white dark:hover:bg-charcoal transition-colors"
              >
                <Ikon nama={modeGelap ? 'matahari' : 'bulan'} ukuran={14} />
                {modeGelap ? 'Mode Terang' : 'Mode Gelap'}
              </button>
            </header>

            <main className="max-w-xl w-full mx-auto my-auto py-8">
              <p className="font-mono text-xs uppercase tracking-widest text-terracotta font-bold mb-2">
                {kategoriAktif.kode} — {kategoriAktif.judul}
              </p>
              <h1 className="text-3xl sm:text-4xl font-bold tracking-tight mb-8">Ringkasan Ketepatan Jawaban</h1>

              <div className="grid grid-cols-2 border border-[#DFDDD4] dark:border-[#2C2C29] rounded-xl bg-white dark:bg-charcoal overflow-hidden mb-8">
                <div className="p-6 border-r border-[#DFDDD4] dark:border-[#2C2C29]">
                  <span className="block font-mono text-[11px] uppercase tracking-wider text-stone-500 mb-2">Nilai Akhir</span>
                  <span className="font-mono text-5xl font-bold tracking-tight">{persentase}%</span>
                </div>
                <div className="p-6">
                  <span className="block font-mono text-[11px] uppercase tracking-wider text-stone-500 mb-2">Jawaban Benar</span>
                  <span className="font-mono text-5xl font-bold tracking-tight">
                    {totalSkor}<span className="text-xl text-stone-400 font-medium">/20</span>
                  </span>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3">
                <button
                  onClick={ulangiDenganSoalBaru}
                  className="flex-1 py-4 px-5 rounded-xl bg-ink dark:bg-[#F2F1ED] text-white dark:text-obsidian font-bold text-sm tracking-wide hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
                >
                  <Ikon nama="ulang" ukuran={17} />
                  <span>Ulangi Modul Ini</span>
                </button>
                <button
                  onClick={kembaliKeBeranda}
                  className="py-4 px-5 rounded-xl border border-[#DFDDD4] dark:border-[#2C2C29] bg-white dark:bg-charcoal font-bold text-sm tracking-wide hover:border-ink dark:hover:border-stone-400 transition-colors flex items-center justify-center gap-2"
                >
                  <Ikon nama="beranda" ukuran={17} />
                  <span>Pilih Modul Lain</span>
                </button>
              </div>
            </main>

            <footer className="max-w-xl w-full mx-auto pt-4 border-t border-[#DFDDD4] dark:border-[#2A2A27] text-xs text-stone-500 font-mono flex justify-between">
              <span>Studio Spasial 3D</span>
              <span>React JS + WebGL</span>
            </footer>
          </div>
        );
      }

      const hurufOpsi = ['A', 'B', 'C', 'D'];
      const adalahOpsiVisual = soalAktif.modeRender === 'proyeksi' || soalAktif.modeRender === 'jaring';

      return (
        <div className="flex flex-col h-[100dvh] bg-paper dark:bg-obsidian text-ink dark:text-[#F2F1ED] overflow-hidden transition-colors duration-200">
          
          {/* BILAH ATAS TERPADU */}
          <header className="h-13 sm:h-14 shrink-0 px-3 sm:px-6 border-b border-[#DFDDD4] dark:border-[#262624] bg-white dark:bg-charcoal flex items-center justify-between z-30">
            <div className="flex items-center gap-2 sm:gap-3 min-w-0">
              <button
                onClick={kembaliKeBeranda}
                className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-[#E2E0D8] dark:border-[#2C2C29] hover:bg-paper dark:hover:bg-obsidian text-xs font-bold transition-colors shrink-0"
                title="Kembali ke Beranda"
              >
                <Ikon nama="beranda" ukuran={14} />
                <span className="hidden sm:inline">Beranda</span>
              </button>
              <h1 className="text-xs sm:text-base font-bold tracking-tight truncate">{kategoriAktif.judul}</h1>
            </div>

            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-paper dark:bg-obsidian border border-[#E2E0D8] dark:border-[#2C2C29] font-mono text-[11px] sm:text-xs">
                <span className="text-stone-500 hidden sm:inline">Benar:</span>
                <span className="font-bold">{totalSkor}<span className="sm:hidden text-stone-400 font-normal">/20</span></span>
              </div>

              <button
                onClick={() => setTema(modeGelap ? 'terang' : 'gelap')}
                className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg border border-[#E2E0D8] dark:border-[#2C2C29] hover:bg-paper dark:hover:bg-obsidian text-xs font-semibold transition-colors"
                title={modeGelap ? 'Ubah ke Mode Terang' : 'Ubah ke Mode Gelap'}
              >
                <Ikon nama={modeGelap ? 'matahari' : 'bulan'} ukuran={15} />
                <span className="hidden sm:inline">{modeGelap ? 'Terang' : 'Gelap'}</span>
              </button>

              <button
                onClick={() => setBukaModalSoal(true)}
                className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg border border-[#E2E0D8] dark:border-[#2C2C29] hover:bg-paper dark:hover:bg-obsidian text-xs font-semibold transition-colors"
              >
                <Ikon nama="kotak" ukuran={15} />
                <span>Daftar Soal</span>
              </button>
            </div>
          </header>

          {/* RUANG KERJA UTAMA: KIRI VISUAL 3D, KANAN LEMBAR SOAL */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">
            
            {/* KOLOM KIRI: PANGGUNG VISUALISASI 3D */}
            <section className="lg:w-[57%] w-full h-[42%] sm:h-[45%] lg:h-full relative bg-[#EFECE6] dark:bg-[#141413] border-b lg:border-b-0 lg:border-r border-[#DFDDD4] dark:border-[#262624] flex flex-col shrink-0">
              
              {/* LEGENDA WARNA LAPISAN / INFO BATAS */}
              <div className="absolute top-3 left-3 sm:top-4 sm:left-4 z-10 pointer-events-none">
                {soalAktif.modeRender === 'jaring' ? (
                  <div className="bg-white/90 dark:bg-charcoal/90 border border-[#DFDDD4] dark:border-[#2C2C29] px-3 py-2 rounded-xl">
                    <span className="block font-mono text-[10px] font-bold uppercase tracking-wider text-stone-500">
                      Kubus 6 Sisi
                    </span>
                    <span className="text-[11px] font-medium text-stone-700 dark:text-stone-300">
                      Putar untuk melihat semua simbol
                    </span>
                  </div>
                ) : (
                  <div className="bg-white/90 dark:bg-charcoal/90 border border-[#DFDDD4] dark:border-[#2C2C29] px-2.5 py-2 sm:px-3 sm:py-2.5 rounded-xl">
                    <span className="block font-mono text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-stone-500 mb-1">
                      {soalAktif.modeRender === 'kerangka' ? `Batas ${soalAktif.batas.p}×${soalAktif.batas.l}×${soalAktif.batas.t}` : 'Indikator Lapis'}
                    </span>
                    <div className="flex flex-col gap-0.5 sm:gap-1">
                      {LAYER_PALETTE.slice(0, Math.max(2, lapisTertinggi)).map((lapis, idx) => (
                        <div key={idx} className="flex items-center gap-1.5 sm:gap-2">
                          <span className="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-xs shrink-0" style={{ backgroundColor: lapis.css }} />
                          <span className="text-[10px] sm:text-[11px] font-medium text-stone-700 dark:text-stone-300">{lapis.label}</span>
                        </div>
                      )).reverse()}
                    </div>
                  </div>
                )}
              </div>

              {/* KANVAS WEBGL 3D */}
              <div className="flex-1 w-full h-full min-h-0">
                <PanggungKubus3D
                  soal={soalAktif}
                  putarOtomatis={putarOtomatis}
                  modeGelap={modeGelap}
                  sudutKamera={sudutKamera}
                  saatGeserManual={() => setSudutAktif(null)}
                />
              </div>

              {/* BILAH KONTROL KAMERA DI BAGIAN BAWAH PANGGUNG */}
              <div className="shrink-0 px-3 sm:px-4 py-2 bg-white/85 dark:bg-charcoal/85 border-t border-[#DFDDD4] dark:border-[#262624] flex items-center justify-between gap-2 text-xs">
                <div className="hidden sm:flex items-center gap-2 text-stone-500 dark:text-stone-400">
                  <Ikon nama="geser" ukuran={14} />
                  <span className="text-[11px] font-medium">Seret untuk memutar bangun</span>
                </div>

                <div className="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-1.5">
                  <div className="flex items-center rounded-lg border border-[#DFDDD4] dark:border-[#2C2C29] bg-paper dark:bg-obsidian p-0.5">
                    {[
                      { id: 'isometrik', label: 'Isometrik' },
                      { id: 'atas', label: 'Atas' },
                      { id: 'depan', label: 'Depan' }
                    ].map((preset) => (
                      <button
                        key={preset.id}
                        onClick={() => ubahSudut(preset.id)}
                        className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                          sudutAktif === preset.id
                            ? 'bg-white dark:bg-charcoal text-ink dark:text-white shadow-2xs'
                            : 'text-stone-500 dark:text-stone-400 hover:text-ink dark:hover:text-white'
                        }`}
                      >
                        {preset.label}
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={() => setPutarOtomatis(!putarOtomatis)}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
                      putarOtomatis
                        ? 'bg-ink dark:bg-[#F2F1ED] text-white dark:text-obsidian border-ink dark:border-[#F2F1ED]'
                        : 'bg-paper dark:bg-obsidian border-[#DFDDD4] dark:border-[#2C2C29] text-stone-600 dark:text-stone-300'
                    }`}
                  >
                    <Ikon nama={putarOtomatis ? 'jeda' : 'putar'} ukuran={13} />
                    <span>{putarOtomatis ? 'Putar: Aktif' : 'Putar: Jeda'}</span>
                  </button>
                </div>
              </div>
            </section>

            {/* KOLOM KANAN: LEMBAR PERTANYAAN & OPSI JAWABAN */}
            <section className="lg:w-[43%] w-full flex-1 lg:h-full flex flex-col bg-white dark:bg-charcoal min-h-0">
              
              {/* GARIS PROGRES TIPIS */}
              <div className="w-full h-1 bg-[#EAE8E1] dark:bg-[#242422] shrink-0">
                <div
                  className="h-full bg-terracotta transition-all duration-300"
                  style={{ width: `${((indeksSoal + 1) / 20) * 100}%` }}
                />
              </div>

              {/* ISI SOAL */}
              <div ref={panelSoalRef} className="flex-1 overflow-y-auto px-5 py-5 sm:px-10 sm:py-8 custom-scrollbar">
                <div className="flex items-center justify-between mb-4 sm:mb-5">
                  <span className="font-mono text-xs font-bold uppercase tracking-wider text-stone-500 dark:text-stone-400">
                    Soal {String(indeksSoal + 1).padStart(2, '0')} / 20
                  </span>
                  <span className="font-mono text-[11px] font-medium text-stone-400 dark:text-stone-500">
                    {Object.keys(jawabanUser).length} Terjawab
                  </span>
                </div>

                <h2 className="text-base sm:text-xl lg:text-[21px] font-bold leading-snug tracking-tight mb-5 sm:mb-6 select-text">
                  {soalAktif.pertanyaan}
                </h2>

                {/* GRID PILIHAN GANDA (ANGKA ATAU DIAGRAM 2D) */}
                <div className="grid grid-cols-2 gap-2.5 sm:gap-3 mb-5 sm:mb-7">
                  {soalAktif.pilihan.map((opsi, i) => {
                    const nilaiOpsi = adalahOpsiVisual ? opsi.id : opsi;
                    const iniBenar = nilaiOpsi === soalAktif.jawabanBenar;
                    const iniDipilih = nilaiOpsi === jawabanUser[indeksSoal];

                    let gayaTombol = "bg-paper dark:bg-obsidian border-[#DFDDD4] dark:border-[#2C2C29] hover:border-ink dark:hover:border-stone-400";
                    let gayaHuruf = "border-[#D5D3CA] dark:border-[#363632] text-stone-500 dark:text-stone-400";

                    if (sudahDijawab) {
                      if (iniBenar) {
                        gayaTombol = "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-600 text-emerald-900 dark:text-emerald-200";
                        gayaHuruf = "bg-emerald-600 border-emerald-600 text-white";
                      } else if (iniDipilih) {
                        gayaTombol = "bg-red-50 dark:bg-red-950/50 border-red-600 text-red-900 dark:text-red-200";
                        gayaHuruf = "bg-red-600 border-red-600 text-white";
                      } else {
                        gayaTombol = "bg-paper/50 dark:bg-obsidian/40 border-[#EAE8E1] dark:border-[#222220] opacity-40 cursor-default";
                      }
                    }

                    return (
                      <button
                        key={i}
                        disabled={sudahDijawab}
                        onClick={() => pilihJawaban(nilaiOpsi)}
                        className={`p-3 sm:p-4 rounded-xl border-2 transition-all flex items-center justify-between text-left active:scale-[0.99] ${gayaTombol}`}
                      >
                        <span className={`w-6 h-6 sm:w-7 sm:h-7 rounded-md border font-mono text-xs font-bold flex items-center justify-center shrink-0 ${gayaHuruf}`}>
                          {hurufOpsi[i]}
                        </span>

                        {soalAktif.modeRender === 'proyeksi' && (
                          <VisualOpsiProyeksi grid={opsi.grid} />
                        )}
                        {soalAktif.modeRender === 'jaring' && (
                          <VisualOpsiJaring pola={opsi.pola} profil={opsi.profil} />
                        )}
                        {!adalahOpsiVisual && (
                          <span className="font-mono text-xl sm:text-2xl font-bold">{opsi}</span>
                        )}

                        <span className="w-5 flex justify-end shrink-0">
                          {sudahDijawab && iniBenar && <Ikon nama="benar" ukuran={18} className="text-emerald-600 dark:text-emerald-400" />}
                          {sudahDijawab && iniDipilih && !iniBenar && <Ikon nama="salah" ukuran={18} className="text-red-600 dark:text-red-400" />}
                        </span>
                      </button>
                    );
                  })}
                </div>

                {/* KOTAK PEMBAHASAN */}
                {sudahDijawab && (
                  <div className={`p-4 sm:p-5 rounded-xl border select-text ${
                    jawabanTepat
                      ? 'bg-emerald-50/70 dark:bg-emerald-950/30 border-emerald-600/30'
                      : 'bg-red-50/70 dark:bg-red-950/30 border-red-600/30'
                  }`}>
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className={`font-mono text-xs font-bold uppercase tracking-wider ${
                        jawabanTepat ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'
                      }`}>
                        {jawabanTepat
                          ? 'Jawaban Benar'
                          : `Jawaban Kurang Tepat (Opsi ${hurufOpsi[soalAktif.pilihan.findIndex(o => (adalahOpsiVisual ? o.id : o) === soalAktif.jawabanBenar)]})`}
                      </span>
                    </div>
                    <p className="text-xs sm:text-sm text-stone-700 dark:text-stone-300 leading-relaxed">
                      {soalAktif.pembahasan}
                    </p>
                  </div>
                )}
              </div>

              {/* NAVIGASI BAWAH */}
              <footer className="shrink-0 px-4 sm:px-6 py-3 sm:py-4 border-t border-[#DFDDD4] dark:border-[#262624] bg-paper/60 dark:bg-obsidian/60 flex items-center justify-between">
                <button
                  onClick={soalSebelumnya}
                  disabled={indeksSoal === 0}
                  className="flex items-center gap-1.5 px-3 sm:px-3.5 py-2.5 rounded-lg text-xs font-bold text-stone-600 dark:text-stone-400 hover:text-ink dark:hover:text-white disabled:opacity-0 transition-all"
                >
                  <Ikon nama="kiri" ukuran={16} />
                  <span>Sebelumnya</span>
                </button>

                <button
                  onClick={soalBerikutnya}
                  className="flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl bg-ink dark:bg-[#F2F1ED] text-white dark:text-obsidian text-xs font-bold tracking-wide hover:opacity-90 transition-opacity"
                >
                  <span>{indeksSoal === 19 ? 'Selesai & Lihat Nilai' : (sudahDijawab ? 'Soal Berikutnya' : 'Lewati Soal')}</span>
                  <Ikon nama="kanan" ukuran={16} />
                </button>
              </footer>
            </section>
          </div>

          {/* MODAL PETA NOMOR SOAL */}
          <ModalDaftarSoal
            buka={bukaModalSoal}
            tutup={() => setBukaModalSoal(false)}
            daftarSoal={daftarSoal}
            indeksAktif={indeksSoal}
            jawabanUser={jawabanUser}
            pilihSoal={(i) => {
              setIndeksSoal(i);
              setBukaModalSoal(false);
            }}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AplikasiSpasial3D />);
  </script>
</body>
</html>
